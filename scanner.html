<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Majd Scan</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%230f2444'/%3E%3Cpath d='M9 23 L9 9 L16 16.6 L23 9 L23 23' fill='none' stroke='%23ffcb05' stroke-width='4.4' stroke-linejoin='miter'/%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#15203a; --navy-2:#1b2a4a; --ink:#16213b; --blue:#2563eb; --blue-d:#1b4ed1;
    --blue-soft:#5b8af2; --tint:#eef4ff; --paper:#eef1f6; --line:#e4e9f2; --muted:#64708a;
    --white:#fff; --danger:#dc4b3e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%}
  body{
    font-family:Inter,system-ui,sans-serif; background:var(--paper); color:var(--ink);
    display:flex; flex-direction:column; height:100dvh; overflow:hidden;
  }
  /* ---------- top bar ---------- */
  .top{
    display:flex; align-items:center; gap:11px; padding:12px 16px;
    background:var(--navy); color:#fff; flex:none;
    padding-top:max(12px, env(safe-area-inset-top));
  }
  .logo{width:30px; height:30px; flex:none}
  .brand{display:flex; flex-direction:column; line-height:1.1}
  .brand b{font-size:17px; font-weight:800; letter-spacing:.2px}
  .brand small{font-size:11px; color:#9fb0cf; font-weight:500}
  .top .grow{flex:1}
  .exportBtn{
    background:var(--blue); color:#fff; border:0; border-radius:9px; font-family:inherit;
    font-size:14px; font-weight:700; padding:9px 16px; cursor:pointer; display:flex; align-items:center; gap:7px;
  }
  .exportBtn:disabled{opacity:.4; cursor:default}
  .exportBtn svg{width:16px; height:16px; stroke:#fff; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}

  /* ---------- home / pages ---------- */
  .home{flex:1; overflow-y:auto; padding:18px 16px 130px}
  .empty{
    height:100%; min-height:55vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; color:var(--muted); gap:14px; padding:24px;
  }
  .empty .ring{
    width:84px; height:84px; border-radius:50%; background:var(--tint);
    display:grid; place-items:center;
  }
  .empty .ring svg{width:40px; height:40px; stroke:var(--blue); fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
  .empty h2{margin:0; font-size:19px; color:var(--ink); font-weight:700}
  .empty p{margin:0; font-size:14px; max-width:280px; line-height:1.5}

  .pageGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:16px}
  .pageCard{
    background:#fff; border:1px solid var(--line); border-radius:14px; padding:10px;
    box-shadow:0 1px 3px rgba(16,24,40,.06); position:relative;
  }
  .pageCard img{width:100%; display:block; border-radius:8px; background:#f4f5f8}
  .pageCard .num{
    position:absolute; top:16px; left:16px; background:rgba(21,32,58,.82); color:#fff;
    font-size:12px; font-weight:700; padding:3px 9px; border-radius:20px;
  }
  .pageCard .row{display:flex; gap:8px; margin-top:9px}
  .pageCard .row button{
    flex:1; border:1.5px solid; border-radius:9px; padding:8px; font-family:inherit; font-size:13px;
    font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:5px;
  }
  .btn-edit{background:#e8f1ff; border-color:#7fb0f0; color:#1763b3}
  .btn-del{background:#fde4e2; border-color:#f08a80; color:#d62b1f}
  .pageCard .row svg{width:15px; height:15px; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
  .pageCard .ctl{display:flex; gap:6px; margin-top:9px}
  .pageCard .ctl button{flex:1; border:1px solid var(--line); background:#fff; border-radius:8px; padding:9px 0; font-size:15px; line-height:1; cursor:pointer; color:#33415a; font-weight:700}
  .pageCard .ctl button:active{background:#eef4ff}
  .pageCard .ctl button.d{color:#d62b1f; border-color:#f0b4ab; background:#fdecea}
  .iconbtn{background:#1d2741; color:#fff; border:0; border-radius:9px; width:40px; height:38px; font-size:20px; line-height:1; cursor:pointer; font-weight:700}
  .iconbtn:disabled{opacity:.4}
  /* action sheet */
  .sheet-bg{position:fixed; inset:0; background:rgba(8,12,22,.5); z-index:80; display:none; align-items:flex-end}
  .sheet-bg.show{display:flex}
  .sheet{background:#fff; width:100%; border-radius:18px 18px 0 0; padding:10px; padding-bottom:max(14px,env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:8px}
  .sheet button{text-align:left; border:0; background:#f4f6fb; border-radius:12px; padding:14px 16px; cursor:pointer; font-family:inherit; display:flex; flex-direction:column; gap:3px}
  .sheet button b{font-size:15px; color:var(--ink)}
  .sheet button span{font-size:12.5px; color:var(--muted)}
  .sheet button.cancel{background:none; text-align:center; color:var(--muted); font-weight:600; padding:12px}

  /* preview */
  .preview{position:fixed; inset:0; background:#2a2f3a; z-index:60; display:none; flex-direction:column}
  .preview.show{display:flex}
  .preview-head{display:flex; align-items:center; gap:12px; padding:14px 16px; padding-top:max(14px,env(safe-area-inset-top)); color:#fff; background:#10182b}
  .preview-head button{background:none; border:0; color:#cdd7ea; font-size:19px; cursor:pointer; padding:2px 6px}
  .preview-head .pv-ttl{font-size:16px; font-weight:700; flex:1}
  .pv-count{font-size:13px; color:#aeb9d2}
  .preview-scroll{flex:1; overflow-y:auto; padding:18px 14px; display:flex; flex-direction:column; gap:18px; align-items:center}
  .pv-page{width:100%; max-width:620px; background:#fff; border-radius:6px; box-shadow:0 6px 22px rgba(0,0,0,.4); overflow:hidden; position:relative}
  .pv-page img{width:100%; display:block}
  .pv-page .pv-num{position:absolute; top:10px; left:10px; background:rgba(21,32,58,.82); color:#fff; font-size:12px; font-weight:700; padding:3px 10px; border-radius:20px}
  .preview-foot{padding:14px 16px; padding-bottom:max(14px,env(safe-area-inset-bottom)); background:#10182b}
  .preview-actions{display:flex; gap:12px; width:100%; max-width:620px; margin:0 auto}
  .preview-actions button{flex:1; border:0; border-radius:12px; padding:16px 12px; font-family:inherit; font-size:15px; font-weight:700; cursor:pointer}
  .pv-scan{background:#fff; color:var(--ink); border:1px solid #d7deea!important}
  .pv-save{background:var(--blue); color:#fff}
  .pv-save:hover{background:var(--blue-d)}

  /* ---------- bottom capture bar ---------- */
  .capbar{
    position:fixed; left:0; right:0; bottom:0; padding:14px 16px;
    padding-bottom:max(14px, env(safe-area-inset-bottom));
    background:linear-gradient(180deg, rgba(238,241,246,0), var(--paper) 38%);
    display:flex; gap:12px; justify-content:center;
  }
  .cap{
    border:0; border-radius:13px; font-family:inherit; font-weight:700; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:9px; padding:16px 22px; font-size:15px;
    box-shadow:0 8px 22px rgba(37,99,235,.28);
  }
  .cap-camera{background:var(--blue); color:#fff; flex:1; max-width:330px}
  .cap-gallery{background:#fff; color:var(--ink); border:1px solid var(--line); box-shadow:0 4px 12px rgba(16,24,40,.08)}
  .cap svg{width:20px; height:20px; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
  .cap-camera svg{stroke:#fff}
  .cap-gallery svg{stroke:var(--ink)}
  .cap-download{background:#16213b; color:#fff; flex:1; max-width:260px; box-shadow:0 8px 22px rgba(16,24,40,.20)}
  .cap-download svg{stroke:#fff}

  /* ---------- crop view ---------- */
  .crop{
    position:fixed; inset:0; background:#0c1322; z-index:50; display:none; flex-direction:column;
  }
  .crop.show{display:flex}
  .crop-head{
    display:flex; align-items:center; justify-content:space-between; padding:14px 16px;
    padding-top:max(14px, env(safe-area-inset-top)); color:#fff;
  }
  .crop-head .ttl{font-size:15px; font-weight:700}
  .crop-head button{background:none; border:0; color:#cdd7ea; font-family:inherit; font-size:15px; font-weight:600; cursor:pointer; padding:6px}
  .crop-head-right{display:flex; align-items:center; gap:6px}
  .crop-head-right #cropReset{font-size:13px; padding:6px}
  .head-add{background:var(--blue)!important; color:#fff!important; border-radius:9px!important; font-size:13px!important; font-weight:700!important; padding:8px 13px!important}
  .crop-stage{flex:1; position:relative; overflow:hidden; touch-action:none}
  #cropCanvas{position:absolute; left:0; top:0}
  #cropSvg{position:absolute; left:0; top:0; pointer-events:none}
  .handle{
    position:absolute; width:30px; height:30px; margin:-15px 0 0 -15px; border-radius:50%;
    background:rgba(37,99,235,.25); border:2.5px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.3);
    touch-action:none; cursor:grab;
  }
  .crop-tools{
    padding:14px 12px; padding-bottom:max(14px, env(safe-area-inset-bottom)); background:#10182b;
  }
  .modes{display:flex; gap:8px; justify-content:center; margin-bottom:13px; flex-wrap:wrap}
  .mode{
    background:#1d2741; color:#aeb9d2; border:1px solid #2b3858; border-radius:20px;
    font-family:inherit; font-size:13px; font-weight:600; padding:8px 15px; cursor:pointer;
  }
  .mode.on{background:var(--blue); color:#fff; border-color:var(--blue)}
  .crop-actions{display:flex; gap:12px; max-width:520px; margin:0 auto}
  .crop-actions button{
    flex:1; border:0; border-radius:12px; font-family:inherit; font-size:15px; font-weight:700;
    padding:15px; cursor:pointer;
  }
  .act-retake{background:#1d2741; color:#cdd7ea}

  /* ---------- live camera view ---------- */
  .livecam{position:fixed; inset:0; background:#000; z-index:55; display:none; flex-direction:column}
  .livecam.show{display:flex}
  .cam-stage{flex:1; position:relative; overflow:hidden; background:#000}
  #camVideo{width:100%; height:100%; object-fit:cover; display:block}
  #camSvg{position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none}
  #camPoly{transition:points .12s linear, stroke .15s, fill .15s}
  #camPoly.armed{stroke:#2ecc71; fill:rgba(46,204,113,0.18)}
  #camPoly.captured{stroke:rgba(255,255,255,.55); fill:rgba(255,255,255,.06); stroke-dasharray:10 8}
  .cam-hint{
    position:absolute; left:50%; bottom:14px; transform:translateX(-50%);
    color:#fff; font-size:13px; font-weight:600; background:rgba(8,12,22,.55);
    padding:7px 14px; border-radius:20px; pointer-events:none; opacity:0; transition:opacity .2s;
  }
  .cam-hint.show{opacity:1}
  .cam-tools{
    padding:20px; padding-bottom:max(20px, env(safe-area-inset-bottom)); background:#10182b;
    display:flex; align-items:center; justify-content:center;
  }
  .shutter{
    width:70px; height:70px; border-radius:50%; background:#fff; cursor:pointer;
    border:5px solid rgba(255,255,255,.32); box-shadow:0 2px 10px rgba(0,0,0,.4);
  }
  .shutter:active{transform:scale(.93)}
  .cam-badge{
    position:absolute; top:14px; left:14px; background:rgba(8,12,22,.6); color:#fff;
    font-size:13px; font-weight:700; padding:6px 13px; border-radius:20px; pointer-events:none;
  }
  .cam-flash{position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .07s linear}
  .cam-flash.on{opacity:.85; transition:none}
  .cam-torch{
    width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.12)!important;
    display:flex; align-items:center; justify-content:center; padding:0!important;
  }
  .cam-torch svg{width:18px; height:18px; stroke:#cdd7ea; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
  .cam-torch.on{background:var(--blue)!important}
  .cam-torch.on svg{stroke:#fff}
  .act-done{background:var(--blue); color:#fff}

  /* ---------- busy ---------- */
  .busy{position:fixed; inset:0; background:rgba(12,19,34,.62); display:none; align-items:center; justify-content:center; z-index:90; flex-direction:column; gap:16px; color:#fff}
  .busy.show{display:flex}
  .spin{width:42px; height:42px; border:3.5px solid rgba(255,255,255,.25); border-top-color:#fff; border-radius:50%; animation:sp .8s linear infinite}
  .busy span{font-size:14px; font-weight:600}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed; left:50%; bottom:96px; transform:translateX(-50%) translateY(20px); background:var(--ink); color:#fff; padding:11px 18px; border-radius:11px; font-size:14px; font-weight:500; opacity:0; pointer-events:none; transition:.25s; z-index:95; max-width:90vw; text-align:center}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .toast.err{background:var(--danger)}

  @media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
</style>
</head>
<body>

<header class="top">
  <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
    <circle cx="16" cy="16" r="15.5" fill="#0f2444"/>
    <path d="M9 23 L9 9 L16 16.6 L23 9 L23 23" fill="none" stroke="#ffcb05" stroke-width="4.4" stroke-linecap="butt" stroke-linejoin="miter"/>
  </svg>
  <div class="brand"><b>Majd Scan</b><small>Document scanner</small></div>
  <div class="grow"></div>
  <button class="exportBtn" id="exportBtn" disabled>
    <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
    Preview
  </button>
  <button class="iconbtn" id="moreBtn" disabled title="More options" style="margin-left:8px">&#8943;</button>
</header>

<main class="home" id="home">
  <div class="empty" id="empty">
    <div class="ring">
      <svg viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 012-2h2M16 4h2a2 2 0 012 2v2M20 16v2a2 2 0 01-2 2h-2M8 20H6a2 2 0 01-2-2v-2"/><path d="M4 12h16"/></svg>
    </div>
    <h2>Scan your first page</h2>
    <p>Snap a photo of a document, line up the corners, and Majd flattens it into a clean PDF.</p>
  </div>
  <div class="pageGrid" id="pageGrid" style="display:none"></div>
</main>

<div class="capbar">
  <button class="cap cap-gallery" id="galBtn" title="Choose from gallery">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5L5 20"/></svg>
  </button>
  <button class="cap cap-camera" id="camBtn">
    <svg viewBox="0 0 24 24"><path d="M4 8a2 2 0 012-2h2l1.5-2h5L16 6h2a2 2 0 012 2v9a2 2 0 01-2 2H6a2 2 0 01-2-2z"/><circle cx="12" cy="12.5" r="3.4"/></svg>
    <span id="scanBtnText">Scan page</span>
  </button>
  <button class="cap cap-download" id="bottomDownload" style="display:none">
    <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
    Download PDF
  </button>
</div>

<!-- crop view -->
<section class="crop" id="cropView">
  <div class="crop-head">
    <button id="cropCancel">Cancel</button>
    <span class="ttl">Adjust corners</span>
    <div class="crop-head-right">
      <button id="cropReset">Reset</button>
      <button id="cropAddTop" class="head-add">Add page</button>
    </div>
  </div>
  <div class="crop-stage" id="cropStage">
    <canvas id="cropCanvas"></canvas>
    <svg id="cropSvg"><polygon id="cropPoly" fill="rgba(37,99,235,0.14)" stroke="#5b8af2" stroke-width="2"/></svg>
  </div>
  <div class="crop-tools">
    <div class="modes" id="modes">
      <button class="mode on" data-mode="auto">Enhance</button>
      <button class="mode" data-mode="gray">Grayscale</button>
      <button class="mode" data-mode="bw">B&amp;W</button>
      <button class="mode" data-mode="orig">Original</button>
    </div>
    <div class="crop-actions">
      <button class="act-retake" id="cropRetake">Retake</button>
      <button class="act-done" id="cropDownload">Preview</button>
    </div>
  </div>
</section>

<!-- live camera view -->
<section class="livecam" id="liveCamView">
  <div class="crop-head">
    <button id="camCancel">Cancel</button>
    <span class="ttl">Scan page</span>
    <button id="camTorch" class="cam-torch" title="Flash" style="visibility:hidden">
      <svg viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>
    </button>
  </div>
  <div class="cam-stage" id="camStage">
    <video id="camVideo" autoplay playsinline muted></video>
    <svg id="camSvg"><polygon id="camPoly" fill="rgba(37,99,235,0.16)" stroke="#5b8af2" stroke-width="2.5"/></svg>
    <div class="cam-badge" id="camBadge">0 pages</div>
    <div class="cam-hint" id="camHint">Point at the document — edges detect automatically</div>
    <div class="cam-flash" id="camFlash"></div>
  </div>
  <div class="cam-tools">
    <button class="shutter" id="camShutter" title="Capture"></button>
  </div>
</section>

<input type="file" accept="image/*" capture="environment" id="camIn" hidden>
<input type="file" accept="image/*" multiple id="galIn" hidden>

<div class="busy" id="busy"><div class="spin"></div><span id="busyMsg">Working…</span></div>
<div class="toast" id="toast"></div>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet" id="sheet">
    <button id="actMajd"><b>Open in Majd</b><span>Send these pages to the editor to sign &amp; annotate</span></button>
    <button id="actOcr"><b>Searchable PDF (OCR)</b><span>Recognise the text so the PDF is searchable · slower, needs connection</span></button>
    <button id="actCancel" class="cancel">Cancel</button>
  </div>
</div>

<section class="preview" id="previewView">
  <div class="preview-head">
    <button id="previewClose" title="Close">&#10005;</button>
    <span class="pv-ttl">Preview</span>
    <span class="pv-count" id="pvCount"></span>
  </div>
  <div class="preview-scroll" id="previewScroll"></div>
  <div class="preview-foot">
    <div class="preview-actions">
      <button class="pv-scan" id="pvScanAnother">Scan another page</button>
      <button class="pv-save" id="pvSave">Download PDF</button>
    </div>
  </div>
</section>

<script>
const $ = s => document.querySelector(s);
const pages = [];           // { src(dataURL original), corners[4 src-px], mode, out(dataURL) }
let editIndex = -1;         // page index being edited, or -1 for new
let queue = [];             // pending gallery files

const busy = (on,msg) => { $("#busyMsg").textContent = msg||"Working…"; $("#busy").classList.toggle("show", !!on); };
let toastT;
function toast(msg, err){ const t=$("#toast"); t.textContent=msg; t.classList.toggle("err",!!err); t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2400); }

/* ---------------- capture ---------------- */
$("#camBtn").onclick = () => openCamera("batch");
$("#galBtn").onclick = () => $("#galIn").click();
$("#camIn").onchange = e => { const f=e.target.files[0]; e.target.value=""; if(f) openFromFile(f); };
$("#galIn").onchange = e => {
  const files=[...e.target.files]; e.target.value="";
  if(!files.length) return;
  queue = files.slice(1);
  openFromFile(files[0]);
};

function fileToImage(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const img=new Image(); img.onload=()=>res(img); img.onerror=rej; img.src=fr.result; };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}

async function openFromFile(file){
  busy(true,"Loading photo…");
  try{
    const img = await fileToImage(file);
    // cap source size so big phone photos stay fast/light
    const MAXS = 3200;
    let sw=img.naturalWidth, sh=img.naturalHeight, sc=Math.min(1, MAXS/Math.max(sw,sh));
    const c=document.createElement("canvas"); c.width=Math.round(sw*sc); c.height=Math.round(sh*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    const src = c.toDataURL("image/jpeg",0.96);
    editIndex = -1;
    const inset = 0.06;
    const fallback = [
      {x:c.width*inset, y:c.height*inset},
      {x:c.width*(1-inset), y:c.height*inset},
      {x:c.width*(1-inset), y:c.height*(1-inset)},
      {x:c.width*inset, y:c.height*(1-inset)},
    ];
    autoCorners = fallback;
    busy(false);
    // open the crop screen right away with the blue guide already showing
    openCrop(src, fallback.map(p=>({x:p.x,y:p.y})), "auto");
    // refine to the detected document edges in the background, without blocking the view
    const myEdit = editIndex;
    setTimeout(()=>{
      const detected = detectDocCorners(c);
      if(detected && editIndex===myEdit){
        autoCorners = detected;
        layoutCrop(detected.map(p=>({x:p.x,y:p.y})));
      }
    }, 20);
  }catch(err){ console.error(err); toast("Couldn't read that photo.",true); busy(false); }
}

let autoCorners = null;
/* find the document as the largest bright region; corners = extreme x±y points (robust to rotation) */
function detectDocCorners(canvas){
  try{
    const W=canvas.width, H=canvas.height;
    const dw=Math.min(420,W), dh=Math.max(1,Math.round(H*dw/W));
    const sm=document.createElement("canvas"); sm.width=dw; sm.height=dh;
    const ctx=sm.getContext("2d",{willReadFrequently:true});
    ctx.drawImage(canvas,0,0,dw,dh);
    const data=ctx.getImageData(0,0,dw,dh).data, n=dw*dh;
    const gray=new Uint8Array(n), hist=new Uint32Array(256);
    for(let i=0;i<n;i++){
      const o=i*4, g=(0.299*data[o]+0.587*data[o+1]+0.114*data[o+2])|0;
      gray[i]=g; hist[g]++;
    }

    // Otsu separates the sheet from most desks, fabric, floors and other backgrounds.
    let total=0; for(let i=0;i<256;i++) total+=i*hist[i];
    let sumB=0,wB=0,best=-1,thr=128;
    for(let t=0;t<256;t++){
      wB+=hist[t]; if(!wB) continue;
      const wF=n-wB; if(!wF) break;
      sumB+=t*hist[t];
      const mB=sumB/wB, mF=(total-sumB)/wF;
      const between=wB*wF*(mB-mF)*(mB-mF);
      if(between>best){ best=between; thr=t; }
    }

    function componentCandidate(bright){
      const mask=new Uint8Array(n);
      // Keep a small safety band out of the search so the camera frame itself is never selected.
      const bx=Math.max(2,Math.round(dw*.012)), by=Math.max(2,Math.round(dh*.012));
      for(let y=by;y<dh-by;y++) for(let x=bx;x<dw-bx;x++){
        const i=y*dw+x;
        mask[i]=bright ? (gray[i] >= Math.min(245,thr+4)) : (gray[i] <= Math.max(10,thr-4));
      }
      // Morphological close/open: fills printed text and tiny holes so a document becomes one region.
      let a=mask, b=new Uint8Array(n);
      for(let pass=0;pass<2;pass++){
        b.fill(0);
        for(let y=1;y<dh-1;y++) for(let x=1;x<dw-1;x++){
          const i=y*dw+x; let on=0;
          for(let yy=-1;yy<=1&&!on;yy++) for(let xx=-1;xx<=1;xx++) if(a[i+yy*dw+xx]){on=1;break;}
          b[i]=on;
        }
        [a,b]=[b,a];
      }
      // Find connected regions and keep the best page-like one.
      const seen=new Uint8Array(n), stack=[]; let bestComp=null, bestScore=-1;
      for(let y=1;y<dh-1;y++) for(let x=1;x<dw-1;x++){
        const seed=y*dw+x; if(!a[seed]||seen[seed]) continue;
        stack.length=0; stack.push(seed); seen[seed]=1;
        let count=0,minX=dw,maxX=0,minY=dh,maxY=0;
        let tlS=1e9,brS=-1e9,trD=-1e9,blD=1e9,TL=null,TR=null,BR=null,BL=null;
        while(stack.length){
          const i=stack.pop(), px=i%dw, py=(i/dw)|0; count++;
          if(px<minX)minX=px;if(px>maxX)maxX=px;if(py<minY)minY=py;if(py>maxY)maxY=py;
          const ss=px+py, df=px-py;
          if(ss<tlS){tlS=ss;TL={x:px,y:py};} if(ss>brS){brS=ss;BR={x:px,y:py};}
          if(df>trD){trD=df;TR={x:px,y:py};} if(df<blD){blD=df;BL={x:px,y:py};}
          const ns=[i-1,i+1,i-dw,i+dw];
          for(const q of ns) if(q>=0&&q<n&&a[q]&&!seen[q]){seen[q]=1;stack.push(q);}
        }
        if(count<n*.07 || !TL||!TR||!BR||!BL) continue;
        const poly=[TL,TR,BR,BL];
        const area=Math.abs(poly.reduce((z,p,j)=>{const q=poly[(j+1)%4];return z+p.x*q.y-q.x*p.y;},0))/2;
        const af=area/n; if(af<.10||af>.96) continue;
        const boxArea=Math.max(1,(maxX-minX)*(maxY-minY));
        const fill=count/boxArea;
        const cx=(minX+maxX)/2, cy=(minY+maxY)/2;
        const centerPenalty=Math.hypot(cx-dw/2,cy-dh/2)/Math.hypot(dw/2,dh/2);
        const touches=(minX<dw*.025?1:0)+(maxX>dw*.975?1:0)+(minY<dh*.025?1:0)+(maxY>dh*.975?1:0);
        const score=af*3 + Math.min(fill,1)*.7 - centerPenalty*.35 - touches*.32;
        if(score>bestScore){bestScore=score;bestComp=poly;}
      }
      return bestComp;
    }

    // First choice: everything that is NOT the desk. The desk is whatever touches the frame border,
    // so a page keeps its dark header or photos, which a brightness-only search would cut off.
    let poly=deskFloodCandidate(data, dw, dh);
    // Documents are usually the brighter region; dark-page support is the fallback.
    if(!poly) poly=componentCandidate(true) || componentCandidate(false);

    // If segmentation is uncertain, use strong outer edges as a fallback.
    if(!poly){
      const edge=new Uint8Array(n); let es=0,ec=0;
      for(let y=1;y<dh-1;y++) for(let x=1;x<dw-1;x++){
        const i=y*dw+x;
        const gx=-gray[i-dw-1]-2*gray[i-1]-gray[i+dw-1]+gray[i-dw+1]+2*gray[i+1]+gray[i+dw+1];
        const gy=-gray[i-dw-1]-2*gray[i-dw]-gray[i-dw+1]+gray[i+dw-1]+2*gray[i+dw]+gray[i+dw+1];
        const m=Math.min(255,(Math.abs(gx)+Math.abs(gy))/3); edge[i]=m; es+=m; ec++;
      }
      const et=Math.max(36,(es/Math.max(1,ec))*2.6), pts=[];
      for(let y=3;y<dh-3;y++) for(let x=3;x<dw-3;x++) if(edge[y*dw+x]>et) pts.push({x,y});
      if(pts.length>100){
        let tlS=1e9,brS=-1e9,trD=-1e9,blD=1e9,TL,TR,BR,BL;
        for(const p of pts){const ss=p.x+p.y,df=p.x-p.y;if(ss<tlS){tlS=ss;TL=p;}if(ss>brS){brS=ss;BR=p;}if(df>trD){trD=df;TR=p;}if(df<blD){blD=df;BL=p;}}
        if(TL&&TR&&BR&&BL) poly=[TL,TR,BR,BL];
      }
    }
    if(!poly) return null;
    const sx=W/dw, sy=H/dh;
    return poly.map(p=>({x:Math.max(0,Math.min(W-1,p.x*sx)),y:Math.max(0,Math.min(H-1,p.y*sy))}));
  }catch(e){ console.warn("Document detection failed",e); return null; }
}

/* Desk = pixels close in colour to the frame border, reachable from the border. The page is the
   biggest region that is left. Returns TL,TR,BR,BL in detection pixels, or null. */
function deskFloodCandidate(data, dw, dh){
  const n=dw*dh, ring=Math.max(3,Math.round(Math.min(dw,dh)*.012));
  // one desk colour per side (handles a light-to-dark gradient across the desk)
  const sides=[[],[],[],[]];
  for(let y=0;y<dh;y++) for(let x=0;x<dw;x++){
    const inTop=y<ring, inBot=y>=dh-ring, inL=x<ring, inR=x>=dw-ring;
    if(!(inTop||inBot||inL||inR)) continue;
    const o=(y*dw+x)*4, px=[data[o],data[o+1],data[o+2]];
    if(inTop) sides[0].push(px); if(inBot) sides[1].push(px); if(inL) sides[2].push(px); if(inR) sides[3].push(px);
  }
  const med=arr=>{ const r=[0,1,2].map(c=>{ const v=arr.map(p=>p[c]).sort((a,b)=>a-b); return v[v.length>>1]; }); return r; };
  const meds=sides.filter(a=>a.length>10).map(med); if(!meds.length) return null;
  const d2=(o,m)=>{ const dr=data[o]-m[0], dg=data[o+1]-m[1], db=data[o+2]-m[2]; return dr*dr+dg*dg+db*db; };
  // tolerance from how varied the border itself is (wood grain, fabric)
  const dists=[]; sides.forEach((arr,i)=>{ if(arr.length<=10) return; const m=meds[Math.min(i,meds.length-1)]; arr.forEach(px=>{ const dr=px[0]-m[0],dg=px[1]-m[1],db=px[2]-m[2]; dists.push(Math.sqrt(dr*dr+dg*dg+db*db)); }); });
  dists.sort((a,b)=>a-b); const p90=dists[Math.floor(dists.length*.9)]||0;
  const T=Math.max(26, Math.min(72, p90*1.5+8)), T2=T*T;
  const deskLike=new Uint8Array(n);
  for(let i=0;i<n;i++){ const o=i*4; for(const m of meds){ if(d2(o,m)<T2){ deskLike[i]=1; break; } } }
  // flood from the border across desk-like pixels
  const flooded=new Uint8Array(n), stack=[];
  for(let x=0;x<dw;x++){ for(const y of [0,dh-1]){ const i=y*dw+x; if(deskLike[i]&&!flooded[i]){ flooded[i]=1; stack.push(i); } } }
  for(let y=0;y<dh;y++){ for(const x of [0,dw-1]){ const i=y*dw+x; if(deskLike[i]&&!flooded[i]){ flooded[i]=1; stack.push(i); } } }
  while(stack.length){ const i=stack.pop(), x=i%dw, y=(i/dw)|0;
    if(x>0){ const j=i-1; if(deskLike[j]&&!flooded[j]){ flooded[j]=1; stack.push(j); } }
    if(x<dw-1){ const j=i+1; if(deskLike[j]&&!flooded[j]){ flooded[j]=1; stack.push(j); } }
    if(y>0){ const j=i-dw; if(deskLike[j]&&!flooded[j]){ flooded[j]=1; stack.push(j); } }
    if(y<dh-1){ const j=i+dw; if(deskLike[j]&&!flooded[j]){ flooded[j]=1; stack.push(j); } } }
  let deskCount=0; for(let i=0;i<n;i++) deskCount+=flooded[i];
  if(deskCount<n*.04) return null;                       // no visible desk: the page fills the frame, let the other method decide
  // largest remaining region = the page
  const seen=new Uint8Array(n); let best=null;
  for(let i=0;i<n;i++){
    if(flooded[i]||seen[i]) continue;
    const comp=[]; stack.length=0; stack.push(i); seen[i]=1;
    let minX=dw,maxX=0,minY=dh,maxY=0;
    while(stack.length){ const k=stack.pop(); comp.push(k); const x=k%dw, y=(k/dw)|0;
      if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y;
      if(x>0){ const j=k-1; if(!flooded[j]&&!seen[j]){ seen[j]=1; stack.push(j); } }
      if(x<dw-1){ const j=k+1; if(!flooded[j]&&!seen[j]){ seen[j]=1; stack.push(j); } }
      if(y>0){ const j=k-dw; if(!flooded[j]&&!seen[j]){ seen[j]=1; stack.push(j); } }
      if(y<dh-1){ const j=k+dw; if(!flooded[j]&&!seen[j]){ seen[j]=1; stack.push(j); } } }
    if(!best||comp.length>best.comp.length) best={comp,minX,maxX,minY,maxY};
  }
  if(!best || best.comp.length<n*.10 || best.comp.length>n*.97) return null;
  // boundary pixels → convex hull → tightest rotated rectangle → snap to the real corners
  const inComp=new Uint8Array(n); for(const k of best.comp) inComp[k]=1;
  const pts=[];
  for(const k of best.comp){ const x=k%dw, y=(k/dw)|0;
    if(x===0||y===0||x===dw-1||y===dh-1||!inComp[k-1]||!inComp[k+1]||!inComp[k-dw]||!inComp[k+dw]) pts.push([x,y]); }
  const hull=convexHull(pts); if(hull.length<4) return null;
  const rect=minAreaRect(hull); if(!rect) return null;
  const snapR=dw*.08;
  const corners=rect.map(c=>{ let bp=null,bd=1e9; for(const q of hull){ const d=Math.hypot(q[0]-c[0],q[1]-c[1]); if(d<bd){bd=d;bp=q;} } return (bd<=snapR)?{x:bp[0],y:bp[1]}:{x:c[0],y:c[1]}; });
  // order TL,TR,BR,BL
  const bySum=corners.slice().sort((a,b)=>(a.x+a.y)-(b.x+b.y)), byDiff=corners.slice().sort((a,b)=>(a.x-a.y)-(b.x-b.y));
  const TL=bySum[0], BR=bySum[3], TR=byDiff[3], BL=byDiff[0];
  const poly=[TL,TR,BR,BL];
  if(new Set(poly).size<4) return null;
  const area=Math.abs(poly.reduce((z,p,j)=>{const q=poly[(j+1)%4];return z+p.x*q.y-q.x*p.y;},0))/2;
  if(area<n*.08) return null;
  return poly;
}
function convexHull(points){
  const P=points.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]); if(P.length<3) return P;
  const cross=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lower=[]; for(const p of P){ while(lower.length>=2&&cross(lower[lower.length-2],lower[lower.length-1],p)<=0) lower.pop(); lower.push(p); }
  const upper=[]; for(let i=P.length-1;i>=0;i--){ const p=P[i]; while(upper.length>=2&&cross(upper[upper.length-2],upper[upper.length-1],p)<=0) upper.pop(); upper.push(p); }
  upper.pop(); lower.pop(); return lower.concat(upper);
}
function minAreaRect(hull){
  let best=null;
  for(let i=0;i<hull.length;i++){
    const a=hull[i], b=hull[(i+1)%hull.length], ang=Math.atan2(b[1]-a[1],b[0]-a[0]), c=Math.cos(-ang), sn=Math.sin(-ang);
    let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
    for(const q of hull){ const x=q[0]*c-q[1]*sn, y=q[0]*sn+q[1]*c; if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; }
    const area=(maxX-minX)*(maxY-minY);
    if(!best||area<best.area){ const c2=Math.cos(ang), s2=Math.sin(ang);
      best={area, pts:[[minX,minY],[maxX,minY],[maxX,maxY],[minX,maxY]].map(([x,y])=>[x*c2-y*s2, x*s2+y*c2])}; }
  }
  return best&&best.pts;
}

/* ---------------- live camera (auto-identify, auto-capture, batch mode) ---------------- */
let camStream=null, camDetectTimer=null, camLastCorners=null, camLastVW=0, camLastVH=0;
let camMode="batch", camBusy=false, camStableCount=0, camStableRef=null, camCooldownUntil=0, camTorchOn=false;
const DET_W=420;                 // width the live frame is shrunk to for edge detection — overlay + capture map back from this
let camArmed=true, camCapture=null, camLastCaptureCorners=null;   // auto-capture re-arms only once the page moves away or changes

function openCamera(mode){
  camMode = mode || "batch";
  camBusy=false; camStableCount=0; camStableRef=null; camCooldownUntil=0; camTorchOn=false; camArmed=true; camLastCaptureCorners=null; camCapture=null;
  $("#camCancel").textContent = camMode==="batch" ? "Done" : "Cancel";
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ $("#camIn").click(); return; }
  navigator.mediaDevices.getUserMedia({
    video:{ facingMode:{ideal:"environment"}, width:{ideal:2560}, height:{ideal:1440} }, audio:false
  }).then(stream=>{
    camStream = stream;
    const track=stream.getVideoTracks()[0];
    try{ track.applyConstraints({advanced:[{focusMode:"continuous"}]}).catch(()=>{}); }catch(_){}
    try{ if(window.ImageCapture) camCapture=new ImageCapture(track); }catch(_){ camCapture=null; }
    const v=$("#camVideo"); v.srcObject=stream;
    $("#liveCamView").classList.add("show");
    updateCamBadge();
    setupTorch();
    const start=()=>{ startCamDetectLoop(); };
    if(v.readyState>=2) start(); else v.onloadedmetadata=start;
  }).catch(err=>{ console.error(err); $("#camIn").click(); });
}

function setupTorch(){
  const btn=$("#camTorch");
  btn.classList.remove("on"); btn.style.visibility="hidden";
  const track = camStream && camStream.getVideoTracks()[0];
  const caps = track && track.getCapabilities ? track.getCapabilities() : null;
  if(caps && caps.torch) btn.style.visibility="visible";
}

$("#camTorch").onclick = async () => {
  const track = camStream && camStream.getVideoTracks()[0]; if(!track) return;
  const next=!camTorchOn;
  try{ await track.applyConstraints({advanced:[{torch:next}]}); camTorchOn=next; $("#camTorch").classList.toggle("on",camTorchOn); }
  catch(err){ console.error(err); }
};

function stopLiveCam(){
  if(camDetectTimer){ clearInterval(camDetectTimer); camDetectTimer=null; }
  if(camTorchOn){ const track=camStream && camStream.getVideoTracks()[0]; if(track && track.applyConstraints){ track.applyConstraints({advanced:[{torch:false}]}).catch(()=>{}); } }
  if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; }
  $("#liveCamView").classList.remove("show");
  $("#camPoly").setAttribute("points",""); $("#camPoly").classList.remove("armed");
  $("#camHint").classList.remove("show");
  camTorchOn=false;
}

function updateCamBadge(){ $("#camBadge").textContent = pages.length+(pages.length===1?" page":" pages"); }

function flashCapture(){ const f=$("#camFlash"); f.classList.add("on"); setTimeout(()=>f.classList.remove("on"),100); }

function cornersMoved(a,b,thresh){
  for(let i=0;i<4;i++){ if(Math.hypot(a[i].x-b[i].x, a[i].y-b[i].y) > thresh) return true; }
  return false;
}

function avgCorners(a,b,alpha){
  if(!a) return b.map(p=>({x:p.x,y:p.y}));
  return a.map((p,i)=>({x:p.x*(1-alpha)+b[i].x*alpha, y:p.y*(1-alpha)+b[i].y*alpha}));
}
function cornerDelta(a,b){
  if(!a||!b) return Infinity;
  let sum=0;
  for(let i=0;i<4;i++) sum+=Math.hypot(a[i].x-b[i].x,a[i].y-b[i].y);
  return sum/4;
}

function startCamDetectLoop(){
  const v=$("#camVideo");
  const detCanvas=document.createElement("canvas");
  let misses=0, candidate=null, candidateFrames=0, locked=null, lockFrames=0;
  camDetectTimer=setInterval(()=>{
    if(!v.videoWidth || camBusy) return;
    camLastVW=v.videoWidth; camLastVH=v.videoHeight;
    // A little more detection resolution makes the edge position less noisy.
    const dw=DET_W, dh=Math.max(1,Math.round(camLastVH*dw/camLastVW));
    detCanvas.width=dw; detCanvas.height=dh;
    detCanvas.getContext("2d").drawImage(v,0,0,dw,dh);
    const raw=detectDocCorners(detCanvas);

    if(raw){
      misses=0;
      // Do not immediately move the blue outline to every new detection.
      // First require several similar frames, then gently smooth it.
      const candidateTol=dw*.032;
      if(candidate && cornerDelta(candidate,raw)<candidateTol){
        candidate=avgCorners(candidate,raw,.35);
        candidateFrames++;
      }else{
        candidate=raw.map(p=>({x:p.x,y:p.y}));
        candidateFrames=1;
      }

      if(candidateFrames>=3){
        if(!locked){
          locked=candidate.map(p=>({x:p.x,y:p.y}));
          lockFrames=1;
        }else{
          const jump=cornerDelta(locked,candidate);
          // Small changes are camera shake: smooth them. Large changes must persist
          // before we allow the guide to jump to a different object/background.
          if(jump<dw*.055){
            locked=avgCorners(locked,candidate,.20);
            lockFrames++;
          }else if(candidateFrames>=6){
            locked=candidate.map(p=>({x:p.x,y:p.y}));
            lockFrames=1;
          }
        }
        camLastCorners=locked.map(p=>({x:p.x,y:p.y}));
      }
    }else{
      misses++;
      candidateFrames=0; candidate=null;
      // Keep the last good outline briefly instead of flashing on/off.
      if(misses>6){ camLastCorners=null; locked=null; lockFrames=0; }
    }

    // Auto-capture only after the LOCKED outline has stayed stable much longer.
    // This prevents false captures when edge detection is still settling.
    const now=Date.now();
    let willCapture=false;
    // After a page is captured, stay disarmed until that page leaves the frame or a clearly
    // different page appears — holding still over the same sheet must never capture it twice.
    if(!camArmed){
      if(!camLastCorners) { if(misses>3) camArmed=true; }
      else if(camLastCaptureCorners && cornerDelta(camLastCorners,camLastCaptureCorners)>dw*.16) camArmed=true;
    }
    if(camLastCorners && camArmed && now>=camCooldownUntil){
      const thresh=dw*.010;
      if(camStableRef && !cornersMoved(camLastCorners,camStableRef,thresh)) camStableCount++;
      else camStableCount=1;
      camStableRef=camLastCorners.map(p=>({x:p.x,y:p.y}));
      if(camStableCount>=8 && lockFrames>=8){
        willCapture=true; camStableCount=0; camStableRef=null; camCooldownUntil=now+1500;
      }
    }else if(!camLastCorners){
      camStableCount=0; camStableRef=null;
    }

    drawCamOverlay(camLastCorners, camArmed ? camStableCount : -1);
    if(willCapture) doCapture(true);
  }, 180);
}

function drawCamOverlay(corners, stableCount){
  const poly=$("#camPoly"), hint=$("#camHint"), svg=$("#camSvg");
  const stage=$("#camStage").getBoundingClientRect();
  svg.setAttribute("width", stage.width); svg.setAttribute("height", stage.height);
  if(!corners || !camLastVW){
    poly.setAttribute("points",""); poly.classList.remove("armed");
    hint.textContent="Finding document edges…"; hint.classList.add("show");
    return;
  }
  poly.classList.toggle("armed", stableCount>=5);
  poly.classList.toggle("captured", stableCount<0);
  hint.textContent = stableCount<0 ? "Page saved — move to the next page" : stableCount>=2 ? "Edges detected — hold still…" : "Finding document edges…";
  hint.classList.add("show");
  const scale=Math.max(stage.width/camLastVW, stage.height/camLastVH);
  const dispW=camLastVW*scale, dispH=camLastVH*scale;
  const offx=(stage.width-dispW)/2, offy=(stage.height-dispH)/2;
  const dw=DET_W, dh=Math.max(1,Math.round(camLastVH*dw/camLastVW));
  const sx=camLastVW/dw, sy=camLastVH/dh;
  const pts=corners.map(p=>(offx+p.x*sx*scale)+","+(offy+p.y*sy*scale)).join(" ");
  poly.setAttribute("points", pts);
}

$("#camCancel").onclick = stopLiveCam;
$("#camShutter").onclick = () => doCapture();

// A real still photo (autofocus, full sensor resolution) beats a video frame when the browser offers it.
async function grabStill(v){
  if(camCapture && camCapture.takePhoto){
    try{
      const blob=await Promise.race([camCapture.takePhoto(), new Promise((_,rej)=>setTimeout(()=>rej(new Error("slow")),2500))]);
      const bmp=await createImageBitmap(blob);
      if(bmp.width>=v.videoWidth*0.9) return bmp;   // only worth it when it's at least as sharp as the video
      bmp.close&&bmp.close();
    }catch(_){ }
  }
  return v; // fall back to the current video frame
}
async function doCapture(auto){
  const v=$("#camVideo");
  if(!v.videoWidth || camBusy) return;
  camBusy=true;
  try{
    const still=await grabStill(v);
    const MAXS=3200;
    let sw=still.width||still.videoWidth, sh=still.height||still.videoHeight, sc=Math.min(1, MAXS/Math.max(sw,sh));
    const c=document.createElement("canvas"); c.width=Math.round(sw*sc); c.height=Math.round(sh*sc);
    c.getContext("2d").drawImage(still,0,0,c.width,c.height);
    if(still.close) still.close();
    const src=c.toDataURL("image/jpeg",0.96);
    const inset=0.06;
    const fallback=[
      {x:c.width*inset,y:c.height*inset},{x:c.width*(1-inset),y:c.height*inset},
      {x:c.width*(1-inset),y:c.height*(1-inset)},{x:c.width*inset,y:c.height*(1-inset)}
    ];
    let corners=fallback;
    // the live outline only maps onto the photo if both have the same shape (a still can be 4:3 while video is 16:9)
    if(camLastCorners && camLastVW && Math.abs((c.width/c.height)/(camLastVW/camLastVH)-1)<0.02){
      const dw=DET_W, dh=Math.max(1,Math.round(camLastVH*dw/camLastVW));
      const sx=c.width/dw, sy=c.height/dh;
      corners = camLastCorners.map(p=>({x:p.x*sx, y:p.y*sy}));
    }
    const refined = detectDocCorners(c);
    if(refined) corners = refined;
    flashCapture();
    try{ if(navigator.vibrate) navigator.vibrate(35); }catch(_){}
    camArmed=false; camLastCaptureCorners = camLastCorners ? camLastCorners.map(p=>({x:p.x,y:p.y})) : null;
    camStableCount=0; camStableRef=null;

    if(camMode==="batch"){
      await new Promise((res,rej)=>{ cropImg.onload=res; cropImg.onerror=rej; cropImg.src=src; if(cropImg.complete && cropImg.naturalWidth) res(); });
      const out = warpAndEnhance(corners, "auto");
      pages.push({ src, corners, mode:"auto", out });
      renderPages();
      updateCamBadge();
    }else{
      autoCorners=corners;
      stopLiveCam();
      openCrop(src, corners.map(p=>({x:p.x,y:p.y})), "auto");
    }
  }catch(err){ console.error(err); toast("Couldn't capture that page.",true); }
  finally{ camBusy=false; }
}

/* ---------------- crop editor ---------------- */
const cropImg = new Image();
let dispScale=1, dispCorners=[], curMode="auto";
const handleEls=[];

function openCrop(src, srcCorners, mode){
  curMode = mode||"auto";
  $("#modes").querySelectorAll(".mode").forEach(b=>b.classList.toggle("on", b.dataset.mode===curMode));
  $("#cropView").classList.add("show");           // show first so the stage has a real size
  cropImg.onload = () => layoutCrop(srcCorners);
  cropImg.src = src;
  if(cropImg.complete && cropImg.naturalWidth) requestAnimationFrame(()=>layoutCrop(srcCorners));
}

function stageSize(){ const s=$("#cropStage").getBoundingClientRect(); return {w:s.width, h:s.height}; }

function layoutCrop(srcCorners){
  const {w:SW, h:SH} = stageSize();
  const iw=cropImg.naturalWidth, ih=cropImg.naturalHeight;
  dispScale = Math.min(SW/iw, SH/ih);
  const dw=iw*dispScale, dh=ih*dispScale;
  const offx=(SW-dw)/2, offy=(SH-dh)/2;
  const cv=$("#cropCanvas");
  cv.width=dw; cv.height=dh; cv.style.left=offx+"px"; cv.style.top=offy+"px";
  applyPreview();
  const svg=$("#cropSvg"); svg.setAttribute("width",SW); svg.setAttribute("height",SH);
  // store display corners (relative to stage)
  dispCorners = srcCorners.map(p=>({x:offx+p.x*dispScale, y:offy+p.y*dispScale}));
  $("#cropStage")._off={x:offx,y:offy};
  buildHandles();
  drawPoly();
}

function buildHandles(){
  const stage=$("#cropStage");
  handleEls.forEach(h=>h.remove()); handleEls.length=0;
  dispCorners.forEach((p,i)=>{
    const h=document.createElement("div"); h.className="handle";
    h.style.left=p.x+"px"; h.style.top=p.y+"px";
    h.addEventListener("pointerdown", ev=>startDrag(ev,i,h));
    stage.appendChild(h); handleEls.push(h);
  });
}

function startDrag(ev,i,h){
  ev.preventDefault(); h.setPointerCapture(ev.pointerId);
  const {w:SW,h:SH}=stageSize();
  const move=e=>{
    const r=$("#cropStage").getBoundingClientRect();
    let x=e.clientX-r.left, y=e.clientY-r.top;
    x=Math.max(0,Math.min(SW,x)); y=Math.max(0,Math.min(SH,y));
    dispCorners[i]={x,y}; h.style.left=x+"px"; h.style.top=y+"px"; drawPoly();
  };
  const up=e=>{ h.releasePointerCapture(ev.pointerId); h.removeEventListener("pointermove",move); h.removeEventListener("pointerup",up); };
  h.addEventListener("pointermove",move); h.addEventListener("pointerup",up);
}

function drawPoly(){ $("#cropPoly").setAttribute("points", dispCorners.map(p=>p.x+","+p.y).join(" ")); }

function applyPreview(){
  const cv=$("#cropCanvas"); if(!cv.width) return;
  const ctx=cv.getContext("2d");
  ctx.drawImage(cropImg,0,0,cv.width,cv.height);
  if(curMode==="orig") return;
  const id=ctx.getImageData(0,0,cv.width,cv.height);
  applyMode(id.data, cv.width, cv.height, curMode);
  ctx.putImageData(id,0,0);
}

$("#cropReset").onclick = () => {
  const iw=cropImg.naturalWidth, ih=cropImg.naturalHeight, inset=0.06;
  const def = autoCorners && editIndex<0 ? autoCorners.map(p=>({x:p.x,y:p.y})) : [
    {x:iw*inset,y:ih*inset},{x:iw*(1-inset),y:ih*inset},
    {x:iw*(1-inset),y:ih*(1-inset)},{x:iw*inset,y:ih*(1-inset)}
  ];
  layoutCrop(def);
};
$("#cropCancel").onclick = () => { $("#cropView").classList.remove("show"); queue=[]; };
$("#cropRetake").onclick = () => { $("#cropView").classList.remove("show"); openCamera("retake"); };

$("#modes").addEventListener("click", e=>{
  const b=e.target.closest(".mode"); if(!b) return;

window.addEventListener("resize", ()=>{ if($("#cropView").classList.contains("show")) layoutCrop(curSrcCorners()); });
function curSrcCorners(){ const off=$("#cropStage")._off||{x:0,y:0}; return dispCorners.map(p=>({x:(p.x-off.x)/dispScale, y:(p.y-off.y)/dispScale})); }

/* ---------------- perspective warp ---------------- */
function adj(m){ return [
  m[4]*m[8]-m[5]*m[7], m[2]*m[7]-m[1]*m[8], m[1]*m[5]-m[2]*m[4],
  m[5]*m[6]-m[3]*m[8], m[0]*m[8]-m[2]*m[6], m[2]*m[3]-m[0]*m[5],
  m[3]*m[7]-m[4]*m[6], m[1]*m[6]-m[0]*m[7], m[0]*m[4]-m[1]*m[3] ]; }
function multmm(a,b){ const r=[]; for(let i=0;i<3;i++)for(let j=0;j<3;j++){ let s=0; for(let k=0;k<3;k++) s+=a[3*i+k]*b[3*k+j]; r[3*i+j]=s; } return r; }
function multmv(m,v){ return [ m[0]*v[0]+m[1]*v[1]+m[2]*v[2], m[3]*v[0]+m[4]*v[1]+m[5]*v[2], m[6]*v[0]+m[7]*v[1]+m[8]*v[2] ]; }
function basisToPoints(p){
  const m=[p[0].x,p[1].x,p[2].x, p[0].y,p[1].y,p[2].y, 1,1,1];
  const v=multmv(adj(m),[p[3].x,p[3].y,1]);
  return multmm(m,[v[0],0,0, 0,v[1],0, 0,0,v[2]]);
}
// homography mapping points 'from' -> 'to'
function projection(from,to){ return multmm(basisToPoints(to), adj(basisToPoints(from))); }

function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

function warpAndEnhance(srcCorners, mode){
  const tmp=document.createElement("canvas"); tmp.width=cropImg.naturalWidth; tmp.height=cropImg.naturalHeight;
  const tctx=tmp.getContext("2d"); tctx.drawImage(cropImg,0,0);
  const sdata=tctx.getImageData(0,0,tmp.width,tmp.height); const S=sdata.data; const SW=tmp.width, SH=tmp.height;
  const [TL,TR,BR,BL]=srcCorners;
  let outW=Math.round(Math.max(dist(TL,TR),dist(BL,BR)));
  let outH=Math.round(Math.max(dist(TL,BL),dist(TR,BR)));
  const CAP=2400, long=Math.max(outW,outH);
  if(long>CAP){ const k=CAP/long; outW=Math.round(outW*k); outH=Math.round(outH*k); }
  outW=Math.max(8,outW); outH=Math.max(8,outH);
  const dstRect=[{x:0,y:0},{x:outW,y:0},{x:outW,y:outH},{x:0,y:outH}];
  const H=projection(dstRect, srcCorners); // out -> src
  const out=document.createElement("canvas"); out.width=outW; out.height=outH;
  const octx=out.getContext("2d"); const odata=octx.createImageData(outW,outH); const O=odata.data;
  for(let y=0;y<outH;y++){
    for(let x=0;x<outW;x++){
      const d=H[6]*x+H[7]*y+H[8];
      const sx=(H[0]*x+H[1]*y+H[2])/d, sy=(H[3]*x+H[4]*y+H[5])/d;
      const oi=(y*outW+x)*4;
      if(sx<0||sy<0||sx>=SW-1||sy>=SH-1){ O[oi]=O[oi+1]=O[oi+2]=255; O[oi+3]=255; continue; }
      const x0=sx|0, y0=sy|0, fx=sx-x0, fy=sy-y0;
      const i00=(y0*SW+x0)*4, i10=i00+4, i01=i00+SW*4, i11=i01+4;
      for(let c=0;c<3;c++){
        const top=S[i00+c]*(1-fx)+S[i10+c]*fx;
        const bot=S[i01+c]*(1-fx)+S[i11+c]*fx;
        O[oi+c]=top*(1-fy)+bot*fy;
      }
      O[oi+3]=255;
    }
  }
  applyMode(O, outW, outH, mode);
  octx.putImageData(odata,0,0);
  return out.toDataURL("image/jpeg", mode==="bw"?0.85:0.9);
}

/* Smooth map of the paper brightness: 8px blocks → local high percentile → blurred. Text and marks
   are small compared with the blocks, so they don't pull the estimate down. */
function backgroundMap(gray, w, h){
  const S=8, bw=Math.ceil(w/S), bh=Math.ceil(h/S), n=bw*bh;
  const blk=new Float32Array(n), tmp=new Uint8Array(S*S);
  for(let by=0;by<bh;by++) for(let bx=0;bx<bw;bx++){
    let k=0;
    for(let y=by*S;y<Math.min(h,by*S+S);y++) for(let x=bx*S;x<Math.min(w,bx*S+S);x++) tmp[k++]=gray[y*w+x];
    const a=tmp.subarray(0,k).slice().sort(); blk[by*bw+bx]=a[Math.floor((k-1)*0.85)];   // 85th percentile of the block
  }
  // Blocks that are much darker than the paper are print, photos or a dark header — not paper in shadow.
  // Don't let them set the background; fill them in from the paper around them instead.
  const sorted=Float32Array.from(blk).sort(), paper=sorted[Math.floor((n-1)*0.9)], lowT=paper*0.55;
  const known=new Uint8Array(n); let anyKnown=false; for(let i=0;i<n;i++){ known[i]=blk[i]>=lowT?1:0; if(known[i]) anyKnown=true; }
  if(anyKnown){
    let left=0; for(let i=0;i<n;i++) if(!known[i]) left++;
    let guard=0;
    while(left>0 && guard++<bw+bh){
      const add=[];
      for(let y=0;y<bh;y++) for(let x=0;x<bw;x++){
        const i=y*bw+x; if(known[i]) continue;
        let sum=0,cnt=0; for(let dy=-1;dy<=1;dy++){ const yy=y+dy; if(yy<0||yy>=bh) continue; for(let dx=-1;dx<=1;dx++){ const xx=x+dx; if(xx<0||xx>=bw) continue; const j=yy*bw+xx; if(known[j]){ sum+=blk[j]; cnt++; } } }
        if(cnt) add.push([i,sum/cnt]);
      }
      if(!add.length) break;
      for(const [i,v] of add){ blk[i]=v; known[i]=1; left--; }
    }
  }
  // take the brighter neighbourhood (radius 3 blocks ≈ 24px) so nothing smaller than a letter counts as "background"
  let a=blk, b=new Float32Array(n);
  for(let pass=0;pass<2;pass++){
    for(let y=0;y<bh;y++) for(let x=0;x<bw;x++){
      let m=0; for(let dy=-3;dy<=3;dy++){ const yy=y+dy; if(yy<0||yy>=bh) continue; for(let dx=-3;dx<=3;dx++){ const xx=x+dx; if(xx<0||xx>=bw) continue; const v=a[yy*bw+xx]; if(v>m) m=v; } }
      b[y*bw+x]=m;
    }
    [a,b]=[b,a];
  }
  // then blur so the map changes gently (no visible block edges)
  for(let pass=0;pass<3;pass++){
    for(let y=0;y<bh;y++) for(let x=0;x<bw;x++){
      let sum=0,cnt=0; for(let dy=-2;dy<=2;dy++){ const yy=y+dy; if(yy<0||yy>=bh) continue; for(let dx=-2;dx<=2;dx++){ const xx=x+dx; if(xx<0||xx>=bw) continue; sum+=a[yy*bw+xx]; cnt++; } }
      b[y*bw+x]=sum/cnt;
    }
    [a,b]=[b,a];
  }
  return a;
}
/* light unsharp mask on the luminance so text edges look crisp after the whitening */
function sharpen(D,w,h){
  const n=w*h, L=new Float32Array(n);
  for(let i=0;i<n;i++){ const o=i*4; L[i]=0.299*D[o]+0.587*D[o+1]+0.114*D[o+2]; }
  const amt=0.45;
  for(let y=1;y<h-1;y++) for(let x=1;x<w-1;x++){
    const i=y*w+x;
    const blur=(L[i-w-1]+L[i-w]+L[i-w+1]+L[i-1]+L[i]+L[i+1]+L[i+w-1]+L[i+w]+L[i+w+1])/9;
    const d=(L[i]-blur)*amt; if(d>-1&&d<1) continue;
    const o=i*4; for(let c=0;c<3;c++){ const v=D[o+c]+d; D[o+c]=v<0?0:v>255?255:v; }
  }
}
function applyMode(D, w, h, mode){
  if(mode==="orig") return;
  const n=w*h;
  // grayscale luminance
  const gray=new Float32Array(n);
  for(let i=0;i<n;i++){ const o=i*4; gray[i]=0.299*D[o]+0.587*D[o+1]+0.114*D[o+2]; }

  if(mode==="gray" || mode==="auto"){
    // Scanner look: estimate how bright the paper is in every part of the page (a smooth map of the
    // local background), then scale each pixel so that background becomes white. Shadows and the grey
    // cast of phone cameras disappear, printed colours stay, and text stays dark.
    const bg=backgroundMap(gray, w, h);
    const S=8, bw=Math.ceil(w/S), bh=Math.ceil(h/S);
    for(let y=0;y<h;y++){
      const fy=Math.min(bh-1,y/S), y0=fy|0, y1=Math.min(bh-1,y0+1), ty=fy-y0;
      for(let x=0;x<w;x++){
        const fx=Math.min(bw-1,x/S), x0=fx|0, x1=Math.min(bw-1,x0+1), tx=fx-x0;
        const b = (bg[y0*bw+x0]*(1-tx)+bg[y0*bw+x1]*tx)*(1-ty) + (bg[y1*bw+x0]*(1-tx)+bg[y1*bw+x1]*tx)*ty;
        const gain=Math.min(3.2, 248/Math.max(40,b));
        const o=(y*w+x)*4;
        const lg=gray[y*w+x]*gain;
        if(lg>=226){ D[o]=D[o+1]=D[o+2]=255; continue; }          // paper → clean white
        if(mode==="gray"){
          let v=(lg-16)*1.08; v=v<0?0:v>255?255:v; D[o]=D[o+1]=D[o+2]=v;
        }else{
          const fade=lg>200?(226-lg)/26:1;                          // ease into white so there is no hard edge
          for(let c=0;c<3;c++){ let v=(D[o+c]*gain-16)*1.08; v=v<0?0:v>255?255:v; D[o+c]=v+(255-v)*(1-fade); }
        }
      }
    }
    sharpen(D,w,h);
    return;
  }
  if(mode==="bw"){
    // adaptive threshold via integral image (local mean), good under uneven light
    const win=Math.max(15, Math.round(Math.min(w,h)/12))|1; const r=win>>1; const Cc=10;
    const integ=new Float64Array((w+1)*(h+1));
    for(let y=0;y<h;y++){ let rowsum=0; for(let x=0;x<w;x++){ rowsum+=gray[y*w+x]; integ[(y+1)*(w+1)+(x+1)]=integ[y*(w+1)+(x+1)]+rowsum; } }
    const sumAt=(x0,y0,x1,y1)=>{ // inclusive rect
      x0=Math.max(0,x0); y0=Math.max(0,y0); x1=Math.min(w-1,x1); y1=Math.min(h-1,y1);
      const A=integ[y0*(w+1)+x0], B=integ[y0*(w+1)+(x1+1)], C=integ[(y1+1)*(w+1)+x0], Dd=integ[(y1+1)*(w+1)+(x1+1)];
      return {s:Dd-B-C+A, cnt:(x1-x0+1)*(y1-y0+1)};
    };
    for(let y=0;y<h;y++){
      for(let x=0;x<w;x++){
        const {s,cnt}=sumAt(x-r,y-r,x+r,y+r);
        const mean=s/cnt; const v=gray[y*w+x];
        const px=(v < mean - Cc) ? 0 : 255;
        const o=(y*w+x)*4; D[o]=D[o+1]=D[o+2]=px;
      }
    }
    return;
  }
}

/* ---------------- add / re-edit page ---------------- */
async function commitCurrentPage(continueQueue){
  busy(true,"Flattening page…");
  await new Promise(r=>setTimeout(r,30));
  try{
    const srcCorners = curSrcCorners();
    const out = warpAndEnhance(srcCorners, curMode);
    const rec = { src:cropImg.src, corners:srcCorners, mode:curMode, out };
    if(editIndex>=0) pages[editIndex]=rec; else pages.push(rec);
    $("#cropView").classList.remove("show");
    renderPages();
    // continue gallery queue
    if(continueQueue && editIndex<0 && queue.length){ const f=queue.shift(); setTimeout(()=>openFromFile(f),120); }
    return true;
  }catch(err){ console.error(err); toast("Couldn't process that page.",true); return false; }
  finally{ busy(false); }
}
$("#cropAddTop").onclick = () => commitCurrentPage(true);
$("#cropDownload").onclick = async () => {
  const ok = await commitCurrentPage(false);
  if(ok) openPreview();
};

function editPage(i){
  editIndex=i; const p=pages[i];
  openCrop(p.src, p.corners.map(c=>({x:c.x,y:c.y})), p.mode);
}
function deletePage(i){ pages.splice(i,1); renderPages(); }

function renderPages(){
  const grid=$("#pageGrid"); grid.innerHTML="";
  const has=pages.length>0;
  $("#empty").style.display=has?"none":"flex";
  grid.style.display=has?"grid":"none";
  $("#exportBtn").disabled=!has; $("#moreBtn").disabled=!has;
  const scanText=$("#scanBtnText"); if(scanText) scanText.textContent=has?"Scan another page":"Scan page";
  const bottomDownload=$("#bottomDownload"); if(bottomDownload) bottomDownload.style.display=has?"flex":"none";
  pages.forEach((p,i)=>{
    const card=document.createElement("div"); card.className="pageCard";
    card.innerHTML =
      '<span class="num">'+(i+1)+'</span>'+
      '<img src="'+p.out+'" alt="Page '+(i+1)+'" title="Tap to re-crop">'+
      '<div class="ctl">'+
        '<button data-a="rot" title="Rotate">&#8635;</button>'+
        '<button data-a="left" title="Move left">&#9664;</button>'+
        '<button data-a="right" title="Move right">&#9654;</button>'+
        '<button data-a="del" class="d" title="Delete">&#10005;</button>'+
      '</div>';
    card.querySelector("img").onclick=()=>editPage(i);
    card.querySelectorAll(".ctl button").forEach(b=>b.onclick=()=>{
      const a=b.dataset.a;
      if(a==="rot") rotatePage(i);
      else if(a==="left") movePage(i,-1);
      else if(a==="right") movePage(i,1);
      else deletePage(i);
    });
    grid.appendChild(card);
  });
}
function movePage(i,dir){ const j=i+dir; if(j<0||j>=pages.length) return; const t=pages[i]; pages[i]=pages[j]; pages[j]=t; renderPages(); }
async function rotatePage(i){
  const p=pages[i];
  try{
    const img=await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=p.out; });
    const c=document.createElement("canvas"); c.width=img.naturalHeight; c.height=img.naturalWidth;
    const ctx=c.getContext("2d"); ctx.translate(c.width/2,c.height/2); ctx.rotate(Math.PI/2);
    ctx.drawImage(img,-img.naturalWidth/2,-img.naturalHeight/2);
    p.out=c.toDataURL("image/jpeg",0.9); p.words=null;  // text boxes no longer valid after rotate
    renderPages();
  }catch(e){ toast("Couldn't rotate.",true); }
}

/* ---------------- export / build PDF ---------------- */
function dataURLtoBytes(durl){
  const b64=durl.split(",")[1]; const bin=atob(b64); const len=bin.length; const u=new Uint8Array(len);
  for(let i=0;i<len;i++) u[i]=bin.charCodeAt(i); return u;
}
async function buildPdfBytes(ocr){
  const { PDFDocument, StandardFonts } = PDFLib;
  const pdf = await PDFDocument.create();
  let font = ocr ? await pdf.embedFont(StandardFonts.Helvetica) : null;
  for(const p of pages){
    const jpg = await pdf.embedJpg(dataURLtoBytes(p.out));
    const iw=jpg.width, ih=jpg.height;
    const pw=595, ph=Math.round(pw*ih/iw);
    const page=pdf.addPage([pw,ph]);
    page.drawImage(jpg,{x:0,y:0,width:pw,height:ph});
    if(ocr && p.words){
      const sx=pw/iw, sy=ph/ih;
      for(const w of p.words){
        const t=(w.text||"").trim(); if(!t || !w.bbox) continue;
        const bx=w.bbox; const fh=Math.max(4,(bx.y1-bx.y0)*sy*0.92);
        try{ page.drawText(t,{x:bx.x0*sx, y:ph-bx.y1*sy, size:fh, font, opacity:0}); }catch(e){}
      }
    }
  }
  // Ask PDF viewers to open the downloaded scan at exactly 100% zoom.
  // XYZ destination: [page, /XYZ, left, top, zoom]. A zoom value of 1 = 100%.
  if (pdf.getPageCount() > 0) {
    try {
      const { PDFName } = PDFLib;
      const firstPage = pdf.getPage(0);
      const openAction = pdf.context.obj([firstPage.ref, PDFName.of("XYZ"), null, null, 1]);
      pdf.catalog.set(PDFName.of("OpenAction"), openAction);
    } catch (e) { console.warn("Could not set initial PDF zoom", e); }
  }
  return await pdf.save();
}
async function downloadPdf(bytes, prefix){
  const filename=(prefix||"scan")+"-"+new Date().toISOString().slice(0,10)+".pdf";
  const blob=new Blob([bytes],{type:"application/pdf"});

  // Desktop / Android Chrome & Edge: native "Save As" dialog
  if(window.showSaveFilePicker){
    try{
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{ description:"PDF document", accept:{ "application/pdf":[".pdf"] } }]
      });
      const writable = await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      return;
    }catch(err){
      if(err && err.name==="AbortError") throw err; // user cancelled the picker
      // otherwise fall through
    }
  }

  // iPhone/iPad (and Android as a fallback): share sheet with "Save to Files"
  if(navigator.canShare){
    try{
      const file = new File([blob], filename, { type:"application/pdf" });
      if(navigator.canShare({ files:[file] })){
        await navigator.share({ files:[file], title:filename });
        return;
      }
    }catch(err){
      if(err && err.name==="AbortError") throw err; // user cancelled the share sheet
      // otherwise fall through
    }
  }

  // Last resort: silent download straight to the default downloads location
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
}
async function savePdf(){
  if(!pages.length) return;
  busy(true,"Building PDF…"); await new Promise(r=>setTimeout(r,30));
  let bytes;
  try{ bytes = await buildPdfBytes(false); }
  catch(err){ console.error(err); busy(false); toast("Export failed — try again.",true); return; }
  busy(false);
  try{ await downloadPdf(bytes,"scan"); toast(pages.length+" page"+(pages.length>1?"s":"")+" saved as PDF."); }
  catch(err){ if(err && err.name!=="AbortError"){ console.error(err); toast("Export failed — try again.",true); } }
}
function openPreview(){
  if(!pages.length){ toast("Scan a page first.",true); return; }
  const host=$("#previewScroll"); host.innerHTML="";
  pages.forEach((p,i)=>{
    const d=document.createElement("div"); d.className="pv-page";
    d.innerHTML='<span class="pv-num">'+(i+1)+'</span><img src="'+p.out+'" alt="Page '+(i+1)+'">';
    host.appendChild(d);
  });
  $("#pvCount").textContent=pages.length+" page"+(pages.length>1?"s":"");
  $("#previewView").classList.add("show");
}
function closePreview(){ $("#previewView").classList.remove("show"); }
$("#exportBtn").onclick = openPreview;
$("#bottomDownload").onclick = savePdf;
$("#previewClose").onclick = closePreview;
$("#pvSave").onclick = savePdf;
$("#pvScanAnother").onclick = () => { closePreview(); openCamera("batch"); };

/* ---------------- action sheet ---------------- */
function openSheet(){ $("#sheetBg").classList.add("show"); }
function closeSheet(){ $("#sheetBg").classList.remove("show"); }
$("#moreBtn").onclick = openSheet;
$("#actCancel").onclick = closeSheet;
$("#sheetBg").addEventListener("click", e=>{ if(e.target===$("#sheetBg")) closeSheet(); });

/* ---------------- handoff to Majd (IndexedDB) ---------------- */
function idbSet(key,val){ return new Promise((res,rej)=>{ const r=indexedDB.open("majd",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>{ const db=r.result; const tx=db.transaction("kv","readwrite"); tx.objectStore("kv").put(val,key); tx.oncomplete=()=>{db.close();res();}; tx.onerror=()=>rej(tx.error); }; r.onerror=()=>rej(r.error); }); }
$("#actMajd").onclick = async () => {
  closeSheet(); if(!pages.length) return;
  busy(true,"Sending to Majd…");
  try{
    const bytes = await buildPdfBytes(false);
    await idbSet("pendingScan", bytes.buffer);
    window.open("pdf-editor.html","_blank");
    toast("Opened in Majd.");
  }catch(err){ console.error(err); toast("Couldn't open Majd.",true); }
  finally{ busy(false); }
};

/* ---------------- OCR (searchable PDF) ---------------- */
function ensureTesseract(){
  if(window.Tesseract) return Promise.resolve();
  return new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    s.onload=res; s.onerror=()=>rej(new Error("Failed to load OCR engine"));
    document.head.appendChild(s);
  });
}
async function runOcr(){
  await ensureTesseract();
  const worker = await Tesseract.createWorker("eng",1,{ logger:m=>{ if(m.status==="recognizing text" && m.progress!=null) busy(true,"Reading text… "+Math.round(m.progress*100)+"%"); } });
  try{
    for(let i=0;i<pages.length;i++){
      busy(true,"Reading page "+(i+1)+"/"+pages.length+"…");
      const { data } = await worker.recognize(pages[i].out);
      pages[i].words = (data.words||[]).map(w=>({text:w.text, bbox:w.bbox}));
    }
  } finally { await worker.terminate(); }
}
$("#actOcr").onclick = async () => {
  closeSheet(); if(!pages.length) return;
  busy(true,"Loading text engine…");
  let bytes;
  try{
    await runOcr();
    busy(true,"Building searchable PDF…");
    bytes = await buildPdfBytes(true);
  }catch(err){ console.error(err); busy(false); toast("OCR failed — check your connection.",true); return; }
  busy(false);
  try{ await downloadPdf(bytes,"scan-searchable"); toast("Searchable PDF saved."); }
  catch(err){ if(err && err.name!=="AbortError"){ console.error(err); toast("Export failed — try again.",true); } }
};

renderPages();
